<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exported GLB material inspection</title><script type="importmap">{"imports":{"three":"../assets/vendor/three/build/three.module.js","three/addons/":"../assets/vendor/three/examples/jsm/"}}</script><style>body{margin:0;background:#f3f5ef;color:#172a29;font:14px system-ui}h1{font-size:18px;margin:25px 35px}main{display:grid;grid-template-columns:repeat(3,1fr)}section{text-align:center}canvas{width:100%;height:380px}p{margin:0 0 20px}</style></head><body><h1>Blender → GLB / browser material inspection</h1><main></main><script type="module">
